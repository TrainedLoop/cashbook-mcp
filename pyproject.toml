[project]
name = "cashbook-mcp"
version = "0.2.1"
description = "MCP server for Pluggy financial data: read-only toward your banks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.4,<5",
    "duckdb>=2.0,<2.1",
    "httpx>=0.28",
    "pytz>=2026.6",
    "google-auth>=2.35",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashbook_mcp"]

[project.scripts]
cashbook-mcp = "cashbook_mcp.server:main"
cashbook-admin = "cashbook_mcp.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["cashbook_mcp"]
