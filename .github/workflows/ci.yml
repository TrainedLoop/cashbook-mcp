name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      # The store loads httpfs explicitly and never autoinstalls it.
      - run: uv run python -c "import duckdb; duckdb.connect().execute('INSTALL httpfs')"
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: cashbook-mcp:ci
      - run: docker run --rm cashbook-mcp:ci python -c "import cashbook_mcp.server"
      - name: Smoke test the encrypted store as the image user
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke/data" "$smoke/secrets"
          chmod 777 "$smoke/data"
          # Dummy secrets only; the snippet never calls Pluggy.
          python3 -c "import secrets; print(secrets.token_hex(32))" > "$smoke/secrets/db.key"
          docker run --rm -e HOME=/nonexistent \
            -v "$smoke/data:/data" -v "$smoke/secrets:/secrets:ro" \
            cashbook-mcp:ci python -c "
          from pathlib import Path
          from cashbook_mcp.store.db import Database
          key = Path('/secrets/db.key').read_text().strip()
          db = Database.open(Path('/data/cashbook.duckdb'), key)
          assert db.schema_version() >= 1
          db.close()
          print('smoke ok')
          "
