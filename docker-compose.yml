services:
  cashbook:
    # Published image. To build from this checkout instead: docker build -t cashbook-mcp:dev .
    # and point image: at it.
    image: ghcr.io/trainedloop/cashbook-mcp:0.1
    restart: unless-stopped
    env_file: .env
    # No ports are published on purpose: put a TLS-terminating tunnel in front
    # (see examples/tailscale-sidecar/). The server listens on PORT (8743) inside the container.
    volumes:
      # The encrypted database. Must survive restarts.
      - ./data:/data
      # pluggy.json, google-oauth.json, db.key, session.key. Read-only: the server never writes here.
      - ./secrets:/secrets:ro
    mem_limit: 512m
